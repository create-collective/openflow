# OpenFlow: backend tests, frontend checks and the Playwright route walk, on every push.
#
# The release matrix that builds the installers lives in openflow-release.yml and runs on
# openflow-v* tags only.
name: openflow-ci

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend checks, unit tests, route walk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install the backend (the route walk runs against it)
        working-directory: backend
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: verify (check-undefined, style budget, vitest, build)
        working-directory: frontend
        run: npm run verify
      - name: playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: route walk
        working-directory: frontend
        run: npm run e2e
        env:
          CI: "1"
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-walk-screenshots
          path: frontend/tests/e2e/shots
          if-no-files-found: ignore
