# OpenFlow release builds: the installers, on openflow-v* tags (or by hand).
#
# Each runner freezes the backend for its own platform and hands it to electron-builder.
# PyInstaller cannot cross-compile, so every platform we ship needs its own runner: there is
# no way to build the macOS sidecar from Windows. Windows (nsis + portable), macOS (dmg, one
# row per architecture) and Linux (AppImage + deb, SCRUM-70) are here. Everyday checks live in
# openflow-ci.yml.
#
# Signing: Windows through Azure Artifact Signing, macOS with a Developer ID certificate plus
# notarization. Both switch on by themselves once the secrets and variables named in the
# "code signing" step exist (scripts/ci-signing.mjs has the list); until then the builds are
# unsigned, as they always were.
name: openflow-release

on:
  push:
    tags:
      - "openflow-v*"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable
          # One row per Mac architecture: the frozen sidecar is built for the runner it is
          # built on, so an Apple Silicon build will not run on an Intel Mac at all.
          # macos-latest is Apple Silicon; macos-15-intel is GitHub's Intel image. It replaced
          # macos-13, which was retired: on 2026-09-18 two runs sat queued on it for hours and
          # never started. An Intel build DOES run on Apple Silicon through Rosetta, so when
          # runner minutes matter more than speed, keep the x64 row alone and drop the arm64
          # one. macOS runners bill at 10x the Linux rate on a private repository.
          - os: macos-latest
            target: --mac dmg --arm64
          - os: macos-15-intel
            target: --mac dmg --x64
          # Linux: an AppImage that runs on most distributions, and a .deb that also installs
          # the udev rule (build/linux/70-openflow.rules) letting the user open the keyboard's
          # serial ports. Built on the OLDEST Ubuntu image on purpose: the frozen sidecar links
          # against the build machine's glibc, so a 22.04 build (glibc 2.35) runs on 22.04 and
          # newer, Debian 12, Fedora 36 and later, where a 24.04 build would refuse to start
          # on all of the older ones.
          - os: ubuntu-22.04
            target: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    env:
      # Where the in-app report form sends things, baked into the build so a tester can file
      # one with no setup. Only ever an automation webhook url: the secret in it fires a
      # single rule that creates a single issue, and can read or edit nothing. Add it under
      # Settings > Secrets and variables > Actions. Without it the build still succeeds and
      # the app falls back to offering the report to be copied or saved.
      OPENFLOW_REPORT_WEBHOOK: ${{ secrets.OPENFLOW_REPORT_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: backend with the build extra
        working-directory: backend
        run: pip install -e ".[build]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: npm ci (shell and renderer)
        run: |
          npm ci
          npm --prefix frontend ci
      - name: the tag names the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "openflow-v${v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${v} (bump __version__, npm run version:sync)"
            exit 1
          fi
      - name: code signing (on when its secrets exist, otherwise an unsigned build)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: node scripts/ci-signing.mjs
      - name: build (version check, renderer, sidecar, sidecar smoke, electron-builder)
        run: npm run build:app -- ${{ matrix.target }}
      - name: the artefacts are signed (when signing is on)
        run: node scripts/ci-signing.mjs --verify
      - name: checksums
        env:
          SUMS_FOR: ${{ matrix.os }}     # not process.platform: both Mac rows report darwin
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const out = fs.readdirSync("release").filter(f => /\.(exe|dmg|AppImage|deb)$/.test(f))
              .map(f => crypto.createHash("sha256").update(fs.readFileSync("release/" + f)).digest("hex") + "  " + f);
            fs.writeFileSync("release/SHA256SUMS-" + process.env.SUMS_FOR + ".txt", out.join("\n") + "\n");
            console.log(out.join("\n"));'
      - uses: actions/upload-artifact@v4
        with:
          name: openflow-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true          # the owner publishes; nothing goes public by itself
