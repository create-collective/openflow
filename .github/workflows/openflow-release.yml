# OpenFlow release builds: the installers, on openflow-v* tags (or by hand).
#
# Each runner freezes the backend for its own platform and hands it to electron-builder.
# PyInstaller cannot cross-compile, so every platform we ship needs its own runner: there is
# no way to build the macOS sidecar from Windows. Windows (nsis + portable) and macOS (dmg,
# unsigned) are here; Linux (AppImage) joins under SCRUM-70. Everyday checks live in
# openflow-ci.yml.
name: openflow-release

on:
  push:
    tags:
      - "openflow-v*"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: openflow

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable
          # One row per Mac architecture: the frozen sidecar is built for the runner it is
          # built on, so an Apple Silicon build will not run on an Intel Mac at all.
          # macos-latest is Apple Silicon; macos-13 is the last Intel image. An Intel build
          # DOES run on Apple Silicon through Rosetta, so when runner minutes matter more than
          # speed, keep the x64 row alone and drop the arm64 one. macOS runners bill at 10x
          # the Linux rate on a private repository.
          - os: macos-latest
            target: --mac dmg --arm64
          - os: macos-13
            target: --mac dmg --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"     # unsigned builds: do not go looking for certificates
      # Where the in-app report form sends things, baked into the build so a tester can file
      # one with no setup. Only ever an automation webhook url: the secret in it fires a
      # single rule that creates a single issue, and can read or edit nothing. Add it under
      # Settings > Secrets and variables > Actions. Without it the build still succeeds and
      # the app falls back to offering the report to be copied or saved.
      OPENFLOW_REPORT_WEBHOOK: ${{ secrets.OPENFLOW_REPORT_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            openflow
            docs/reference
            device/userdata-snapshot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: backend with the build extra
        working-directory: openflow/backend
        run: pip install -e ".[build]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            openflow/package-lock.json
            openflow/frontend/package-lock.json
      - name: npm ci (shell and renderer)
        run: |
          npm ci
          npm --prefix frontend ci
      - name: the tag names the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "openflow-v${v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${v} (bump __version__, npm run version:sync)"
            exit 1
          fi
      - name: build (version check, renderer, sidecar, sidecar smoke, electron-builder)
        run: npm run build:app -- ${{ matrix.target }}
      - name: checksums
        env:
          SUMS_FOR: ${{ matrix.os }}     # not process.platform: both Mac rows report darwin
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const out = fs.readdirSync("release").filter(f => /\.(exe|dmg|AppImage)$/.test(f))
              .map(f => crypto.createHash("sha256").update(fs.readFileSync("release/" + f)).digest("hex") + "  " + f);
            fs.writeFileSync("release/SHA256SUMS-" + process.env.SUMS_FOR + ".txt", out.join("\n") + "\n");
            console.log(out.join("\n"));'
      - uses: actions/upload-artifact@v4
        with:
          name: openflow-${{ matrix.os }}
          path: |
            openflow/release/*.exe
            openflow/release/*.dmg
            openflow/release/*.AppImage
            openflow/release/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true          # the owner publishes; nothing goes public by itself
