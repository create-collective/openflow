[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openflow-backend"
dynamic = ["version"]     # openflow_backend.__version__ is the one source of truth
description = "OpenFlow backend — open-source replacement for NayaFlow's flow-bg-server + NayaCore, built on the nayactl CDC protocol."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyserial>=3.5",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
build = ["pyinstaller>=6.16"]     # the desktop sidecar (openflow_backend.spec)

[project.scripts]
openflow-backend = "openflow_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openflow_backend*"]

[tool.setuptools.dynamic]
version = { attr = "openflow_backend.__version__" }

[tool.setuptools.package-data]
# Everything the package reads at runtime, so a non-editable install and the frozen bundle
# (collect_data_files) both carry it.
openflow_backend = ["db/*.sql", "db/*.json", "device/*.json", "_vendor/nayactl/LICENSE", "_vendor/*.md"]
